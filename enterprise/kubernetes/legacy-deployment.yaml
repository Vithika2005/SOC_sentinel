apiVersion: apps/v1
kind: Deployment
metadata:
  name: legacy-admin-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: legacy-admin-service
  template:
    metadata:
      labels:
        app: legacy-admin-service
    spec:
      containers:
      - name: legacy-admin-service
        image: legacy-admin-image:latest
        ports:
        - containerPort: 5000
        securityContext:
          # Vulnerability: Privileged container execution (IaC / Checkov target)
          privileged: true