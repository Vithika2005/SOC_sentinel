name: SAST Scan

on: [push]

jobs:
  sast:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.8'

      - name: Install dependencies
        run: |
          pip install semgrep

      - name: Run Semgrep SAST scan
        run: |
          semgrep --config pmd rules --path .
