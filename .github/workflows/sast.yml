name: SAST Scan

on: [push, pull_request]

jobs:
  sast:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.8'

      - name: Install Semgrep
        run: pip install semgrep

      - name: Run Semgrep SAST scan (Output JSON)
        run: |
          mkdir -p reports
          semgrep --config=p/ci enterprise/legacy-admin/ --json -o reports/semgrep-results.json || true

      - name: Upload SAST Report Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sast-report
          path: reports/semgrep-results.json