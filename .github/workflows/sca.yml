name: SCA Scan

on: [push]

jobs:
  sca:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.8'

      - name: Install dependencies
        run: |
          pip install dependency-check-tool

      - name: Run Dependency Check SCA scan
        run: |
          dependency-check --scan .
