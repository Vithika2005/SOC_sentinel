name: IAC Scan

on: [push]

jobs:
  iac:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.8'

      - name: Install dependencies
        run: |
          pip install checkov

      - name: Run Checkov IAC scan
        run: |
          checkov --directory terraform/
