name: Secrets Scan

on: [push, pull_request]

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Gitleaks
        run: |
          wget https://github.com/gitleaks/gitleaks/releases/download/v8.18.1/gitleaks_8.18.1_linux_x64.tar.gz
          tar -zxvf gitleaks_8.18.1_linux_x64.tar.gz
          sudo mv gitleaks /usr/local/bin/

      - name: Run Gitleaks (Output JSON)
        run: |
          mkdir -p reports
          gitleaks detect --source=. -f json -r reports/gitleaks-results.json || true

      - name: Upload Secrets Report Artifact
        uses: actions/upload-artifact@v4
        with:
          name: secrets-report
          path: reports/gitleaks-results.json