global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

scrape_configs:

  # --------------------------------------------------
  # Prometheus itself
  # --------------------------------------------------
  - job_name: "prometheus"
    static_configs:
      - targets:
          - "localhost:9090"

  # --------------------------------------------------
  # Blackbox Exporter
  # --------------------------------------------------
  - job_name: "blackbox-exporter"
    static_configs:
      - targets:
          - "blackbox-exporter:9115"

  # --------------------------------------------------
  # SentinelX HTTP health monitoring
  #
  # Prometheus asks Blackbox to probe the endpoints.
  # --------------------------------------------------
  - job_name: "sentinelx-health"
    metrics_path: /probe

    params:
      module:
        - http_2xx

    static_configs:

      - targets:
          - "http://host.docker.internal:8001/health"
        labels:
          service: "incident-service"

      - targets:
          - "http://host.docker.internal:8002/health"
        labels:
          service: "ai-orchestrator"

      - targets:
          - "http://host.docker.internal:8003/health"
        labels:
          service: "digital-twin"

      - targets:
          - "http://host.docker.internal:8004/health"
        labels:
          service: "rag-service"


    relabel_configs:

      - source_labels:
          - __address__
        target_label: __param_target

      - source_labels:
          - __param_target
        target_label: instance

      - source_labels:
          - service
        target_label: service

      - target_label: __address__
        replacement: "blackbox-exporter:9115"

  # --------------------------------------------------
  # Qdrant
  # --------------------------------------------------
  - job_name: "qdrant"
    metrics_path: /metrics
    static_configs:
      - targets:
          - "qdrant:6333"