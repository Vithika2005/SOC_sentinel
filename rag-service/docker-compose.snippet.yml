# Add both blocks alongside your existing services in docker-compose.yml.
# qdrant matches the box already in your architecture diagram.

  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant-data:/qdrant/storage
    networks:
      - sentinelx-net

  rag-service:
    build: ./rag-service
    container_name: rag-service
    env_file:
      - ./rag-service/.env
    environment:
      QDRANT_URL: http://qdrant:6333
    ports:
      - "8003:8000"
    depends_on:
      - qdrant
    networks:
      - sentinelx-net

# and add this under your top-level `volumes:` key:
#   qdrant-data: