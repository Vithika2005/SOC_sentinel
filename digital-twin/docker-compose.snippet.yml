# Add both blocks alongside your existing services in docker-compose.yml.

  neo4j:
    image: neo4j:5-community
    container_name: neo4j
    environment:
      NEO4J_AUTH: neo4j/sentinelx123
    ports:
      - "7474:7474"   # browser UI
      - "7687:7687"   # bolt protocol
    volumes:
      - neo4j-data:/data
    networks:
      - sentinelx-net

  digital-twin:
    build: ./sentinelx/digital-twin
    container_name: digital-twin
    env_file:
      - ./sentinelx/digital-twin/.env
    environment:
      NEO4J_URI: bolt://neo4j:7687
    ports:
      - "8004:8000"
    depends_on:
      - neo4j
    networks:
      - sentinelx-net

# and add this under your top-level `volumes:` key:
#   neo4j-data:
