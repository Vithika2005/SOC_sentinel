version: "3.8"

services:
  postgres:
    image: postgres:15-alpine
    container_name: sentinelx-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: mysecretpassword
      POSTGRES_DB: enterprise_db
    ports:
      - "5432:5432"
    networks:
      - sentinelx-net
    restart: unless-stopped

  auth-service:
    build: ./enterprise/auth-service
    container_name: local-auth
    ports:
      - "8080:5000"
    depends_on:
      - postgres
    networks:
      - sentinelx-net

  api-service:
    build: ./enterprise/api-service
    container_name: local-api
    ports:
      - "8081:5000"
    depends_on:
      - postgres
    networks:
      - sentinelx-net

  legacy-admin:
    build: ./enterprise/legacy-admin
    container_name: legacy-admin-container
    environment:
      PYTHONPATH: /app
    ports:
      - "5004:5000"
    depends_on:
      - postgres
    networks:
      - sentinelx-net

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: sentinelx-kafka
    hostname: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:29093"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_LISTENERS: "PLAINTEXT://:29092,CONTROLLER://:29093,PLAINTEXT_HOST://:9092"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    networks:
      - sentinelx-net
    restart: unless-stopped

  incident-service:
    build:
      context: ./incident-service
    container_name: incident-service
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_INPUT_TOPIC: sentinelx-security-events
      KAFKA_OUTPUT_TOPIC: incidents
      DATABASE_URL: postgresql+asyncpg://postgres:mysecretpassword@postgres:5432/enterprise_db
    ports:
      - "8001:8000"
    depends_on:
      - kafka
      - postgres
    networks:
      - sentinelx-net
    restart: unless-stopped
  
  neo4j:
    image: neo4j:5.18.0
    container_name: neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/password123
    volumes:
      - neo4j-data:/data
    networks:
      - sentinelx-net

  digital-twin:
    build: ./digital-twin
    container_name: digital-twin
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: password123
    ports:
      - "8003:8000"
    depends_on:
      - neo4j
    networks:
      - sentinelx-net

  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant-data:/qdrant/storage
    networks:
      - sentinelx-net

  rag-service:
    build: ./rag-service
    container_name: rag-service
    environment:
      QDRANT_URL: http://qdrant:6333
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
    ports:
      - "8004:8000"
    depends_on:
      - qdrant
    networks:
      - sentinelx-net

  ai-orchestrator:
    build: ./ai-orchestrator
    container_name: ai-orchestrator
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_INPUT_TOPIC: incidents
      KAFKA_OUTPUT_TOPIC: agent-recommendations
      RAG_SERVICE_URL: http://rag-service:8000
      DIGITAL_TWIN_URL: http://digital-twin:8000
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      OLLAMA_MODEL: llama3.1
    ports:
      - "8002:8000"
    depends_on:
      - kafka
      - incident-service
      - rag-service
      - digital-twin
    networks:
      - sentinelx-net
    restart: unless-stopped

  dashboard-service:
    build: ./dashboard-service
    container_name: dashboard-service
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: mysecretpassword
      POSTGRES_DB: enterprise_db
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    ports:
      - "8005:8000"
    depends_on:
      - postgres
      - kafka
    networks:
      - sentinelx-net

volumes:
  qdrant-data:
  neo4j-data:

networks:
  sentinelx-net:
    driver: bridge