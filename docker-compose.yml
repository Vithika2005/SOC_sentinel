version: '3.8'
services:
  nginx:
    image: nginx:latest
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/conf.d:/etc/nginx/conf.d

  auth-service:
    build:
      context: ./enterprise/auth-service/
      dockerfile: Dockerfile
    ports:
      - "5001:5000"

  api-service:
    build:
      context: ./enterprise/api-service/
      dockerfile: Dockerfile
    ports:
      - "5002:5000"

  file-service:
    build:
      context: ./enterprise/file-service/
      dockerfile: Dockerfile
    ports:
      - "5003:5000"

  legacy-admin:
    build:
      context: ./enterprise/legacy-admin/
      dockerfile: Dockerfile
    ports:
      - "5004:5000"

  postgres:
    image: postgres:latest
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: db

  redis:
    image: redis:latest
